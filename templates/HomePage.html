<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Forecaster - Cek Stunting AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='Css/HomePage.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid d-flex justify-content-center gap-3">
            <img src="{{ url_for('static', filename='Assets/baby.png') }}" alt="Logo" width="40" height="40">
            <span class="navbar-brand">Growth Forecaster</span>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="content-container">
            <div class="row g-4 align-items-start">
                <div class="col-md-6">
                    <div class="custom-card form-card">

                        <h2>Cek Pertumbuhan</h2>
                        <p class="subtitle">Deteksi Dini Stunting dengan AI</p>

                        <div class="mb-3">
                            <label>Jenis Kelamin</label>
                            <select id="gender" class="form-select">
                                <option value="Laki-laki">Laki-laki</option>
                                <option value="Perempuan">Perempuan</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Umur (Bulan)</label>
                            <input type="number" id="age" class="form-control" placeholder="Contoh: 12">
                        </div>

                        <div class="mb-3">
                            <label>Tinggi Badan (cm)</label>
                            <input type="number" id="height" step="0.1" class="form-control" placeholder="Contoh: 75.5">
                        </div>

                        <button class="btn-predict" onclick="predictGrowth()">Analyze Now</button>
                    </div>
                </div>

                <div class="col-md-6" id="result-column" style="display: none; opacity: 0;">
                    <div class="custom-card result-card" id="result-box">
                        <div class="status-badge" id="status-badge">Normal</div>
                        
                        <h3 id="result-title">Normal</h3>
                        <p class="ideal-text" id="ideal-msg">Target: 80cm</p>
                        
                        <hr>
                        
                        <div class="food-recommendation">
                            <p class="suggestion-intro" id="suggestion-intro">Coba menu ini:</p>
                            <div class="food-card">
                                <img id="food-img" src="https://placehold.co/400x200?text=Food+Image" alt="Food">
                                <div class="food-info">
                                    <h5 id="food-name">Food Name</h5>
                                    <span class="nutrition-tag" id="food-nutrition">Nutrition Info</span>
                                    <div class="d-flex gap-2 mt-3">
                                        
                                        <a id="btn-youtube" href="#" target="_blank" class="btn-recipe btn-yt">
                                            <img src="{{ url_for('static', filename='Assets/youtube.png') }}" style="height: 25px; width: 25px;">
                                            Tutorial Resep
                                        </a>
                                        
                                        <a id="btn-website" href="#" target="_blank" class="btn-recipe btn-web">
                                            <img src="{{ url_for('static', filename='Assets/cookpad.png') }}" style="height: 25px; width: 25px;">
                                            Baca Resep
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div> 
    </div>
    <script src="{{ url_for('static', filename='Js/HomePage.js') }}"></script>
</body>
</html>
